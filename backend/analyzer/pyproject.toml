[project]
name = "terra-analyzer"
version = "0.1.0"
description = "Terra's analyzer service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["terra_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests", "terra_analyzer/evals"]
markers = [
    "slow: hits a real local llama.cpp / HF model server (deselect with -m 'not slow')",
]
