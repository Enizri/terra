# Install toolchains from upstream mirrors (go.dev / apt / nodejs.org) instead of
# actions/setup-* so CI is not blocked when codeload.github.com returns HTTP 429.
name: check

on:
  push:
    branches: [staging, main, master]
  pull_request:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        run: |
          set -euo pipefail
          ver="$(awk '/^go /{print $2; exit}' backend/api/go.mod)"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=/usr/local/go" >> "$GITHUB_ENV"

      - name: Install Python 3.12
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv
          sudo ln -sfn "$(command -v python3.12)" /usr/local/bin/python3
          python3 --version

      - name: Install Node.js 22
        run: |
          set -euo pipefail
          # Pin a current Node 22 LTS build; bump when CI needs a newer patch.
          ver="22.18.0"
          curl -fsSL "https://nodejs.org/dist/v${ver}/node-v${ver}-linux-x64.tar.xz" -o /tmp/node.txz
          sudo tar -xJf /tmp/node.txz -C /usr/local --strip-components=1
          node --version
          npm --version

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Ensure GOPATH/bin is on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Python venv
        run: make venv

      - name: Check
        run: make check
