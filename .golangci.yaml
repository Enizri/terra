# Style aligned with https://github.com/usememos/memos — gofmt + goimports, no custom column padding.
version: "2"

linters:
  enable:
    - revive
    - govet
    - staticcheck
    - misspell
    - gocritic
    - godot
    - depguard
  disable:
    - errcheck
  settings:
    # Mechanical guard for the layering in ARCHITECTURE.md: `server` is the
    # top of internal/ — nothing below it may import it. The rest of the
    # import direction falls out of package structure on its own.
    depguard:
      rules:
        no-server-from-internal:
          files:
            - "**/internal/**"
            - "!**/internal/server/**"
          deny:
            - pkg: github.com/Enizri/terra/backend/api/internal/server
              desc: only cmd/ may import internal/server (see ARCHITECTURE.md)
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1021
    revive:
      # Curated defaults — enable-all-rules floods this repo with style nits
      # (add-constant, use-slices-sort, …) that aren't part of the layering
      # contract. depguard above is the architectural guard.
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: exported
          disabled: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Enizri/terra/backend/api
