# Style aligned with https://github.com/usememos/memos — gofmt + goimports, no custom column padding.
version: "2"

linters:
  enable:
    - revive
    - govet
    - staticcheck
    - misspell
    - gocritic
    - godot
    - depguard
  disable:
    - errcheck
  settings:
    # Mechanical guard for the layering in ARCHITECTURE.md: `server` is the
    # top of internal/ — nothing below it may import it. The rest of the
    # import direction falls out of package structure on its own.
    depguard:
      rules:
        no-server-from-internal:
          files:
            - "**/internal/**"
            - "!**/internal/server/**"
          deny:
            - pkg: github.com/Enizri/terra/internal/server
              desc: only cmd/ may import internal/server (see ARCHITECTURE.md)
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1021
    revive:
      enable-all-rules: true
      rules:
        - name: file-header
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: function-length
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Enizri/terra
