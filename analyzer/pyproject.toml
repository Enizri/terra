[project]
name = "terra-analyzer"
version = "0.1.0"
description = "Terra's AI layer: OpenAI-compatible agents over a local Hugging Face model"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]
local = [
    "torch",
    "transformers>=5.14",  # dtype= (torch_dtype= is deprecated); the version actually run here
    "accelerate",
    # Multipart hub downloads (HF_HUB_ENABLE_HF_TRANSFER=1); a 15 GB
    # checkpoint on one stream is most of a first run's wall time.
    "hf_transfer",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["terra_analyzer*"]

[tool.pytest.ini_options]
markers = [
    "slow: hits a real local HF model server (deselect with -m 'not slow')",
]
